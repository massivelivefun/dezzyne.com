"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"
  command = """\
    yarn install --frozen-lockfile && \
    yarn typecheck && \
    yarn build && \
    zola build\
    """

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = """\
      accelerometer=(), autoplay=(), bluetooth=(), browsing-topics=(), \
      camera=(), display-capture=(), fullscreen=(), geolocation=(), \
      gyroscope=(), hid=(), interest-cohort=(), magnetometer=(), \
      microphone=(), midi=(), payment=(), picture-in-picture=(), \
      screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()\
      """
    Content-Security-Policy = """\
      default-src 'none'; \
      script-src 'self' 'wasm-unsafe-eval'; \
      style-src 'sha256-Ho62mQu68yTGxfwAK2nuXtWON4Nh1ESY+aaJisKmZx8='; \
      img-src 'self'; \
      font-src 'self'; \
      connect-src 'self'; \
      manifest-src 'self'; \
      base-uri 'none'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      require-trusted-types-for 'script'; \
      trusted-types 'none'; \
      upgrade-insecure-requests\
      """

[[headers]]
  for = "/404/*"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/*/404/*"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/8f4d2c9a6e1b47d3a5c0f8e2b9d4c1a7.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/wasm/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/wasm/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/wasm/skyboxes/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, noarchive, nosnippet"

[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
