"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base    = "/"
  publish = "public"
  command = "zola build"
  ignore  = "[ \"$BRANCH\" != \"stable\" ]"

[build.environment]
  NODE_VERSION = "22"
  ZOLA_VERSION = "0.23.6"

[context.deploy-preview]
  command = "zola build --base-url $DEPLOY_PRIME_URL"
