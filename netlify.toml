"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base    = "/"
  publish = "public"
  command = "zola build"
  ignore  = "[ \"$BRANCH\" != \"stable\" ]"

[build.environment]
  NODE_VERSION = "22"
  ZOLA_VERSION = "0.23.6"

[context.deploy-preview]
  command = "zola build --base-url $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
