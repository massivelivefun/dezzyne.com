# The URL the site will be built for
base_url = "https://www.dezzyne.com"
title = "Dezzyne"
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]
# Syntax highlighting configuration (Zola 0.22+)
[markdown.highlighting]
theme = "github-dark"

[translations]
nav_about = "About"
nav_games = "Games"
nav_ugce = "UGCE"
nav_contact = "Contact"
back_all_games = "All Games"
back_all_ugce = "All UGCE"
label_platform = "Platform"
form_honeypot = "Do not fill this out:"
form_name = "Name"
form_email = "Email"
form_message = "Message"
form_send = "Send"
not_found_message = "There's nothing here, you should turn back..."
footer_rights = "All rights reserved."

