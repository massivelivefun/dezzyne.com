name: Deploy Beta
run-name: Deploy ${{ github.ref_name }}

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-beta:
    name: Build & Draft Deploy (Beta)
    if: >-
      github.repository == 'dezzyne/dezzyne.com' &&
      github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Typecheck and compile TypeScript
        run: |
          if [ -f package.json ]; then
            yarn install --frozen-lockfile
            yarn typecheck
            yarn build
          fi

      - name: Install Zola 0.23.6
        run: |
          ZOLA_URL="https://github.com/getzola/zola/releases/download"
          ZOLA_TAR="zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz"
          ZOLA_SHA="8f5132b3522412d04e395e0b25f6d686"
          ZOLA_SHA="${ZOLA_SHA}13ad272a873e54a2b3ebf664873024a4"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "${ZOLA_URL}/v0.23.6/${ZOLA_TAR}" -o /tmp/zola.tar.gz
          echo "${ZOLA_SHA}  /tmp/zola.tar.gz" | sha256sum -c -
          sudo tar xz -f /tmp/zola.tar.gz -C /usr/local/bin
          rm -f /tmp/zola.tar.gz
          zola --version

      - name: Build Rust WASM (if present)
        run: |
          if [ -f rust/Cargo.toml ]; then
            rustup target add wasm32-unknown-unknown
            cargo build \
              --manifest-path rust/Cargo.toml \
              --target wasm32-unknown-unknown \
              --release
            mkdir -p static/wasm
            WASM_OUT="rust/target/wasm32-unknown-unknown/release"
            cp "${WASM_OUT}/dezzyne_bg.wasm" static/wasm/dezzyne_bg.wasm
          fi

      - name: Check and build Zola site
        run: |
          zola check
          zola build

      - name: Verify CSP style-src SHA-256 hash
        run: |
          CSS_HASH="$(openssl dgst -sha256 -binary templates/style.css \
            | openssl base64 -A)"
          if ! grep -Fq "sha256-${CSS_HASH}" netlify.toml; then
            echo "CSP style-src hash mismatch! Expected: sha256-${CSS_HASH}"
            exit 1
          fi

      - name: Draft deploy to Netlify
        run: |
          npm install --global netlify-cli@27.20.0
          netlify deploy \
            --no-build \
            --dir=public \
            --message="Verify beta (${GITHUB_SHA::7})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
