name: Deploy Stable
run-name: Deploy ${{ github.ref_name }}

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-stable:
    name: Build & Publish Production (Stable)
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Zola 0.23.6
        run: |
          ZOLA_URL="https://github.com/getzola/zola/releases/download"
          ZOLA_TAR="zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "${ZOLA_URL}/v0.23.6/${ZOLA_TAR}" \
            | sudo tar xz -C /usr/local/bin
          zola --version

      - name: Build Rust WASM (if present)
        run: |
          if [ -f rust/Cargo.toml ]; then
            rustup target add wasm32-unknown-unknown
            cargo build \
              --manifest-path rust/Cargo.toml \
              --target wasm32-unknown-unknown \
              --release
            mkdir -p static/wasm
            WASM_OUT="rust/target/wasm32-unknown-unknown/release"
            cp "${WASM_OUT}/dezzyne_bg.wasm" static/wasm/dezzyne_bg.wasm
          fi

      - name: Check and build Zola site
        run: |
          zola check
          zola build

      - name: Verify CSP style-src SHA-256 hash
        run: |
          CSS_HASH="$(openssl dgst -sha256 -binary templates/style.css \
            | openssl base64 -A)"
          if ! grep -Fq "sha256-${CSS_HASH}" netlify.toml; then
            echo "CSP style-src hash mismatch! Expected: sha256-${CSS_HASH}"
            exit 1
          fi

      - name: Publish production deploy to Netlify
        run: |
          npm install --global netlify-cli
          netlify deploy \
            --no-build \
            --prod \
            --dir=public \
            --message="Deploy stable (${GITHUB_SHA::7})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
