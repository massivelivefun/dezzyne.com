name: Deploy Stable
run-name: Deploy stable

on:
  push:
    branches:
      - stable
  workflow_run:
    workflows:
      - Deploy Beta
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stable
  cancel-in-progress: false

jobs:
  deploy-stable:
    name: Build & Publish Production (Stable)
    if: >-
      github.repository == 'dezzyne/dezzyne.com' && (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'beta' &&
          github.event.workflow_run.head_repository.owner.login == 'dezzyne'
        ) || (
          github.event_name != 'workflow_run' &&
          github.ref == 'refs/heads/stable'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Typecheck and compile TypeScript
        run: |
          if [ -f package.json ]; then
            yarn install --frozen-lockfile
            yarn typecheck
            yarn build
          fi

      - name: Install Zola 0.23.6
        run: |
          ZOLA_URL="https://github.com/getzola/zola/releases/download"
          ZOLA_TAR="zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "${ZOLA_URL}/v0.23.6/${ZOLA_TAR}" \
            | sudo tar xz -C /usr/local/bin
          zola --version

      - name: Build Rust WASM (if present)
        run: |
          if [ -f rust/Cargo.toml ]; then
            rustup target add wasm32-unknown-unknown
            cargo build \
              --manifest-path rust/Cargo.toml \
              --target wasm32-unknown-unknown \
              --release
            mkdir -p static/wasm
            WASM_OUT="rust/target/wasm32-unknown-unknown/release"
            cp "${WASM_OUT}/dezzyne_bg.wasm" static/wasm/dezzyne_bg.wasm
          fi

      - name: Check and build Zola site
        run: |
          zola check
          zola build

      - name: Verify CSP style-src SHA-256 hash
        run: |
          CSS_HASH="$(openssl dgst -sha256 -binary templates/style.css \
            | openssl base64 -A)"
          if ! grep -Fq "sha256-${CSS_HASH}" netlify.toml; then
            echo "CSP style-src hash mismatch! Expected: sha256-${CSS_HASH}"
            exit 1
          fi

      - name: Publish production deploy to Netlify
        run: |
          npm install --global netlify-cli
          netlify deploy \
            --no-build \
            --prod \
            --dir=public \
            --message="Deploy stable (${TARGET_SHA::7})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

  advance-stable:
    name: Advance stable Branch Pointer
    needs: deploy-stable
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fast-forward stable ref to verified beta commit
        run: |
          gh api \
            --method PATCH \
            /repos/dezzyne/dezzyne.com/git/refs/heads/stable \
            -f sha="${TARGET_SHA}" \
            -F force=false
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
